name: CI Automated testing

on:
  workflow_dispatch:
  # push:
  #   branches: [ zephyr ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
      with:
          path: beremiz

    - uses: actions/checkout@v3
      with:
          repository: beremiz/matiec
          ref: 3a41303bcb4e50403417bc39c63f88981d7d961e
          path: matiec

    - uses: actions/checkout@v3
      with:
          repository: open62541/open62541
          # v1.5.9
          ref: 05c2b389b65cc35884eb40d800301af1f3d130cf
          path: open62541
          submodules: recursive

    - uses: actions/checkout@v3
      with:
          repository: beremiz/Modbus
          ref: 74a5f6a2c3f9b61308a62fc58bbe10572d79a003
          path: Modbus

    - uses: actions/checkout@v3
      with:
          repository: beremiz/erpc
          # v1.13.0 + no CRC on TCP
          ref: 86549891eb35351585381dd42d6337fc5599eadd
          path: erpc
              
    - uses: actions/checkout@v3
      with:
          repository: beremiz/frozen
          ref: cfff12e9d3f20e9ea670ced1beb27be141fa3254
          path: frozen

    - uses: actions/checkout@v3
      with:
          repository: eclipse-paho/paho.mqtt.c
          ref: 4a939ddb01eea581a32fd6f0adcfee51b91d2601
          path: paho.mqtt.c

    - name: Restore cached docker image
      id: cache-docker-restore
      uses: actions/cache/restore@v3
      env:
        cache-name: cache-docker
      with:
        path: /tmp/latest.tar
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('beremiz/tests/tools/Docker/**', 'beremiz/requirements_pinned.txt') }}

    - if: ${{ steps.cache-docker-restore.outputs.cache-hit == false }}
      name: Create docker image
      run: |
        cd beremiz/tests/tools/Docker
        ./build_docker_image.sh
        docker image save --output="/tmp/latest.tar" beremiz_playwright

    - if: ${{ steps.cache-docker-restore.outputs.cache-hit == false }}
      name: Save docker image in cache
      id: cache-docker-save
      uses: actions/cache/save@v3
      with:
        path: /tmp/latest.tar
        key: ${{ steps.cache-docker-restore.outputs.cache-primary-key }}

    - if: ${{ steps.cache-docker-restore.outputs.cache-hit != false }}
      name: Re-use docker image
      run: |
        docker image load --input="/tmp/latest.tar" 

    - name: Create docker container
      run: |
        cd beremiz/tests/tools/Docker
        ./create_docker_container.sh ${{ github.workspace }}/test
        # workaround for ownership of shared volume on github actions
        ./exec_in_docker_as_root.sh "chown -R ubuntu:ubuntu /home/ubuntu/test"
        
    - name: Run tests in docker
      timeout-minutes: 30  # Add this line
      run: |
        cd beremiz/tests/tools/Docker
        ./do_test_in_docker.sh

    - name: Prepare test results for artifact upload
      if: ${{ always() }}
      run: |
        cd beremiz/tests/tools/Docker
        # change ownership of test results to back to current user
        ./exec_in_docker_as_root.sh "chown -R $(id -u):$(id -g) /home/ubuntu/test"

    - name: Upload test results artifact
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: test_results
        path: ${{ github.workspace }}/test
        retention-days: 5
